# Nome da aplicação (aparece nos logs).
spring.application.name=EventPro

# Conexão com o PostgreSQL (banco "eventpro" rodando local na porta 5432).
spring.datasource.url=jdbc:postgresql://localhost:5432/eventpro
spring.datasource.username=postgres
# Sen@c2023
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# update: o Hibernate cria/altera as tabelas a partir das entidades (ex: cria a tabela "token" sozinho).
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate executa (bom para estudar).
spring.jpa.show-sql=true

